<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3D 擬真卡帶盒 · RetroVault</title>
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');

:root {
  --bg: #060913;
  --panel: rgba(15, 21, 37, 0.78);
  --border: rgba(42, 58, 90, 0.65);
  --cyan: #00e5ff;
  --mint: #69f0ae;
  --purple: #ce93d8;
  --txt: #e8eaf6;
  --txt2: #9fa8c8;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: var(--bg);
  font-family: 'Noto Sans TC', sans-serif;
  color: var(--txt);
  user-select: none;
}

#canvas-container {
  position: absolute;
  inset: 0;
  width: 100%; height: 100%;
  touch-action: none;
  background: radial-gradient(circle at 50% 38%, rgba(20, 30, 60, 0.5) 0%, rgba(6, 9, 19, 0.95) 75%);
}

/* 頂部導航列 */
.top-bar {
  position: absolute;
  top: 16px; left: 16px; right: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  z-index: 50;
  pointer-events: none;
}

.top-bar > * { pointer-events: auto; }

.btn-nav {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 20px;
  color: var(--txt);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  backdrop-filter: blur(12px);
  transition: all 0.2s ease;
  text-decoration: none;
}
.btn-nav:hover, .btn-nav:active {
  border-color: var(--cyan);
  color: var(--cyan);
  transform: translateY(-1px);
}

.title-pill {
  padding: 8px 18px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 20px;
  backdrop-filter: blur(12px);
  text-align: center;
  max-width: 50vw;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.title-pill .sub {
  font-size: 10.5px;
  color: var(--cyan);
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 1.5px;
}
.title-pill .main {
  font-size: 13px;
  font-weight: 700;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 底部操作面板 */
.bottom-dock {
  position: absolute;
  bottom: 24px; left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 28px;
  backdrop-filter: blur(16px);
  box-shadow: 0 12px 36px rgba(0,0,0,0.55);
  z-index: 50;
  max-width: 92vw;
  overflow-x: auto;
}

.dock-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  min-width: 56px;
  height: 48px;
  padding: 4px 8px;
  border-radius: 20px;
  background: transparent;
  border: none;
  color: var(--txt2);
  font-size: 10px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
}
.dock-btn .icon { font-size: 17px; }
.dock-btn:hover { color: var(--txt); background: rgba(255,255,255,0.06); }
.dock-btn.active {
  color: var(--cyan);
  background: rgba(0, 229, 255, 0.12);
  box-shadow: 0 0 12px rgba(0, 229, 255, 0.25) inset;
}

.dock-divider {
  width: 1px;
  height: 24px;
  background: var(--border);
  margin: 0 2px;
}

/* 遊戲選擇清單選單 */
.game-selector {
  background: rgba(10, 14, 26, 0.85);
  border: 1px solid var(--border);
  border-radius: 16px;
  color: var(--txt);
  padding: 6px 12px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  outline: none;
  max-width: 160px;
}

/* 手勢引導提示 */
.gesture-hint {
  position: absolute;
  top: 76px; left: 50%;
  transform: translateX(-50%);
  font-size: 11px;
  color: rgba(159, 168, 200, 0.85);
  background: rgba(15, 21, 37, 0.65);
  padding: 4px 14px;
  border-radius: 12px;
  border: 1px solid rgba(42, 58, 90, 0.4);
  backdrop-filter: blur(8px);
  pointer-events: none;
  animation: fadeInOut 4s forwards;
  z-index: 40;
}
@keyframes fadeInOut {
  0% { opacity: 0; transform: translate(-50%, -6px); }
  15% { opacity: 1; transform: translate(-50%, 0); }
  75% { opacity: 1; }
  100% { opacity: 0; pointer-events: none; }
}

/* 讀取指示器 */
#loading-overlay {
  position: absolute;
  inset: 0;
  background: rgba(6, 9, 19, 0.85);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  z-index: 99;
  transition: opacity 0.4s ease;
}
#loading-overlay.fade-out {
  opacity: 0;
  pointer-events: none;
}
.spinner {
  width: 44px; height: 44px;
  border: 3px solid rgba(0, 229, 255, 0.2);
  border-top-color: var(--cyan);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* 平台角標 */
.plat-badge {
  display: inline-block;
  padding: 2px 7px;
  border-radius: 6px;
  font-size: 10px;
  font-weight: 900;
  font-family: 'JetBrains Mono', monospace;
  margin-right: 4px;
}
.plat-badge.fc { background: rgba(255, 82, 82, 0.2); color: #ff5252; border: 1px solid rgba(255, 82, 82, 0.4); }
.plat-badge.md { background: rgba(0, 229, 255, 0.2); color: var(--cyan); border: 1px solid rgba(0, 229, 255, 0.4); }

@media (max-width: 600px) {
  .top-bar {
    top: 10px; left: 8px; right: 8px;
    gap: 6px;
  }
  .btn-nav {
    padding: 6px 10px;
    font-size: 11px;
    gap: 4px;
  }
  .title-pill {
    padding: 4px 8px;
    max-width: 36vw;
  }
  .title-pill .sub { font-size: 9px; letter-spacing: 0.5px; }
  .title-pill .main { font-size: 11px; }
  .form-select-sample {
    padding: 6px 8px;
    font-size: 11px;
    max-width: 34vw;
  }
  .bottom-dock {
    bottom: 12px;
    padding: 4px 8px;
    gap: 4px;
    max-width: 96vw;
  }
  .dock-btn {
    min-width: 48px;
    height: 44px;
    padding: 4px 6px;
    font-size: 10px;
  }
  .dock-btn .icon { font-size: 15px; }
}
</style>

<!-- Three.js + OrbitControls + LocalForage -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
// ══ 精選展示資料集（取自資料庫真實 CDN 圖片）══
var SAMPLE_GAMES = [

    cover: 'https://raw.githubusercontent.com/libretro-thumbnails/Nintendo_-_Nintendo_Entertainment_System/master/Named_Boxarts/Sangokushi%20(Japan).png',
    back:  'https://raw.githubusercontent.com/Kevinte67228/Retro-library/main/docs/cdn/ab003ef9-e5c0-4eea-940c-d8c6f20b218f.jpg',

  },

    cover: 'https://raw.githubusercontent.com/libretro-thumbnails/Nintendo_-_Nintendo_Entertainment_System/master/Named_Boxarts/Sangokushi%202%20-%20Haou%20no%20Tairiku%20(1992-06-10)(Namco)(JP).png',

    cartColor: '#1c2833' // 南夢宮黑卡帶
  },
  {

    name: 'ナムクラシック (Namco Classic)',
    sub: 'FAMICOM / NAMCO',
    cover: 'https://raw.githubusercontent.com/libretro-thumbnails/Nintendo_-_Nintendo_Entertainment_System/master/Named_Boxarts/Namco%20Classic%20(Japan).png',
    back:  'https://raw.githubusercontent.com/Kevinte67228/Retro-library/main/docs/cdn/045b85dd-e230-4809-80de-9145858621ec.png',
    spine: 'https://raw.githubusercontent.com/Kevinte67228/Retro-library/main/docs/cdn/d6dfb20b-429c-4830-8c92-d83036382b3a.png',
    cartLabel: 'https://raw.githubusercontent.com/libretro-thumbnails/Nintendo_-_Nintendo_Entertainment_System/master/Named_Boxarts/Namco%20Classic%20(Japan).png',

    back:  'https://raw.githubusercontent.com/Kevinte67228/Retro-library/main/docs/cdn/0e22f16d-cf0f-46d4-963f-354f0b251d5d.jpg',

// ══ 實體比例參數 ══
var BOX_DIMENSIONS = {
  FC: { w: 3.5, h: 2.35, d: 0.58, radius: 0.03, paper: true },   // 紅白機橫式紙盒
  MD: { w: 2.8, h: 3.9,  d: 0.62, radius: 0.05, paper: false },  // MD 黑色塑膠外盒
  SFC: { w: 2.5, h: 4.4, d: 0.68, radius: 0.03, paper: true },   // 超任直立紙盒
  PCE: { w: 3.1, h: 3.1, d: 0.35, radius: 0.02, paper: false },  // PC-Engine 透明CD盒 (Jewel Case, 約 142×125×10mm)
  PCECD: { w: 3.1, h: 3.1, d: 0.35, radius: 0.02, paper: false },// PC-Engine CD-ROM² 透明CD盒
  BOOK: { w: 2.7, h: 3.9, d: 0.45, radius: 0.02, paper: true }   // 攻略本／文獻書籍
};

// ══ Three.js 全域狀態 ══
var scene, camera, renderer, controls;
var mainBoxGroup, outerBoxMesh, innerTrayGroup, cartMesh;
var isUnboxed = false;
var unboxProgress = 0; // 0=闔上, 1=完全抽出
var isAutoRotating = true;
var currentLightMode = 0; // 0=展櫃, 1=暖光, 2=霓虹
var lights = {};
var currentGame = null;

function initThree() {
  var container = document.getElementById('canvas-container');
  var width = window.innerWidth;
  var height = window.innerHeight;

  // 場景
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x060913, 0.05);

  // 相機（35度視角，最自然的產品透視）
  camera = new THREE.PerspectiveCamera(35, width / height, 0.1, 100);
  camera.position.set(0, 0.8, 8.5);

  // 渲染器
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
  renderer.setSize(width, height);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  container.appendChild(renderer.domElement);

  // 軌道控制器（平滑阻尼）
  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.maxDistance = 14;
  controls.minDistance = 3.5;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 1.2;
  controls.target.set(0, 0, 0);

  // 使用者觸控時暫停自動旋轉
  controls.addEventListener('start', function() {
    isAutoRotating = false;
    controls.autoRotate = false;
    document.getElementById('btn-autorotate').classList.remove('active');
  });

  // 建立燈光
  setupLighting();

  // 建立地面微反射與陰影接收平面
  setupFloor();

  // 視窗縮放自適應
  window.addEventListener('resize', onWindowResize);

  // 載入遊戲或預設範例
  loadInitialGame();

  // 啟動渲染迴圈
  animate();
}

function setupLighting() {
  // 環境光
  lights.ambient = new THREE.AmbientLight(0xffffff, 0.7);
  scene.add(lights.ambient);

  // 主聚光燈（右上方）
  lights.main = new THREE.DirectionalLight(0xfff5ea, 1.8);
  lights.main.position.set(5, 7, 6);
  lights.main.castShadow = true;
  lights.main.shadow.mapSize.width = 1024;
  lights.main.shadow.mapSize.height = 1024;
  lights.main.shadow.bias = -0.0005;
  scene.add(lights.main);

  // 邊緣輪廓燈（左後方，讓卡帶盒邊緣立體反光）
  lights.rim = new THREE.DirectionalLight(0x00e5ff, 1.2);
  lights.rim.position.set(-6, 4, -5);
  scene.add(lights.rim);

  // 底部微弱補光
  lights.bounce = new THREE.DirectionalLight(0x69f0ae, 0.4);
  lights.bounce.position.set(0, -5, 2);
  scene.add(lights.bounce);
}

function setupFloor() {
  var floorGeo = new THREE.PlaneGeometry(30, 30);
  var floorMat = new THREE.ShadowMaterial({ opacity: 0.35 });
  var floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -2.2;
  floor.receiveShadow = true;
  scene.add(floor);
}

// ══ 輔助：CORS 代理與備用紋理生成 ══
function getTextureUrl(raw) {
  if (!raw || typeof raw !== 'string') return '';
  if (raw.indexOf('data:') === 0 || raw.indexOf('blob:') === 0) return raw;
  if (raw.indexOf('images.launchbox-app.com') >= 0 || raw.indexOf('drive.google.com') >= 0) {
    return 'https://images.weserv.nl/?url=' + encodeURIComponent(raw);
  }
  return raw;
}

function createFallbackCanvas(type, title, plat, dev) {
  var cvs = document.createElement('canvas');
  var isFC = (plat === 'FC');
  cvs.width = (type === 'spine') ? 128 : 512;
  cvs.height = (type === 'spine') ? 512 : (isFC ? 340 : 680);
  var ctx = cvs.getContext('2d');

  if (type === 'spine') {
    var grad = ctx.createLinearGradient(0, 0, cvs.width, 0);
    grad.addColorStop(0, isFC ? '#7f0000' : '#111625');
    grad.addColorStop(0.5, isFC ? '#b71c1c' : '#1a2236');
    grad.addColorStop(1, isFC ? '#7f0000' : '#111625');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, cvs.width, cvs.height);

    ctx.fillStyle = isFC ? '#ff5252' : '#00e5ff';
    ctx.fillRect(0, 0, cvs.width, 16);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(isFC ? 'FC' : 'MD', cvs.width / 2, 40);

    ctx.save();
    ctx.translate(cvs.width / 2, cvs.height / 2);
    ctx.rotate(Math.PI / 2);
    ctx.font = 'bold 24px "Noto Sans TC", sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    var shortTitle = (title || 'RETRO GAME').slice(0, 14);
    ctx.fillText(shortTitle, 0, 8);
    ctx.restore();
  } else if (type === 'back') {
    ctx.fillStyle = isFC ? '#1a1d29' : '#0d111a';
    ctx.fillRect(0, 0, cvs.width, cvs.height);
    ctx.strokeStyle = isFC ? '#ff5252' : '#00e5ff';
    ctx.lineWidth = 6;
    ctx.strokeRect(16, 16, cvs.width - 32, cvs.height - 32);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 26px "Noto Sans TC", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(title || '經典遊戲', cvs.width / 2, 80);

    ctx.fillStyle = '#9fa8c8';
    ctx.font = '16px monospace';
    ctx.fillText((plat || 'FC') + ' ARCHIVAL COLLECTION', cvs.width / 2, 120);

    ctx.fillStyle = '#060913';
    ctx.fillRect(40, 150, cvs.width - 80, 180);
    ctx.strokeStyle = '#2a3a5a';
    ctx.lineWidth = 2;
    ctx.strokeRect(40, 150, cvs.width - 80, 180);
    ctx.fillStyle = '#00e5ff';
    ctx.font = '14px monospace';
    ctx.fillText('RETROVAULT 3D ARCHIVE', cvs.width / 2, 245);

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(cvs.width / 2 - 80, cvs.height - 70, 160, 45);
    ctx.fillStyle = '#000000';
    for (var i = 0; i < 28; i++) {
      if (i % 2 === 0) ctx.fillRect(cvs.width / 2 - 70 + i * 5, cvs.height - 65, 3, 35);
    }
  } else {
    ctx.fillStyle = isFC ? '#991b1b' : '#0f172a';
    ctx.fillRect(0, 0, cvs.width, cvs.height);
    ctx.strokeStyle = isFC ? '#ef4444' : '#38bdf8';
    ctx.lineWidth = 8;
    ctx.strokeRect(16, 16, cvs.width - 32, cvs.height - 32);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 32px "Noto Sans TC", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(title || '經典遊戲', cvs.width / 2, cvs.height / 2 - 20);

    ctx.fillStyle = '#38bdf8';
    ctx.font = '20px monospace';
    ctx.fillText((plat || 'FC') + ' CARTRIDGE BOX', cvs.width / 2, cvs.height / 2 + 30);
  }
  return cvs;
}

// ══ 建立 3D 擬真卡帶盒與內部抽屜 ══
function build3DBox(game) {
  if (mainBoxGroup) {
    scene.remove(mainBoxGroup);
  }

  mainBoxGroup = new THREE.Group();
  scene.add(mainBoxGroup);

  var plat = game.platform || 'FC';
  var dim = BOX_DIMENSIONS[plat] || BOX_DIMENSIONS.FC;

  var textureLoader = new THREE.TextureLoader();
  var overlay = document.getElementById('loading-overlay');
  overlay.classList.remove('fade-out');

  var loadedCount = 0;
  var totalCount = 3;
  var forceTimer = setTimeout(function() {
    overlay.classList.add('fade-out');
  }, 1200);

  function markLoaded() {
    loadedCount++;
    if (loadedCount >= totalCount) {
      clearTimeout(forceTimer);
      setTimeout(function() { overlay.classList.add('fade-out'); }, 200);
    }
  }

  function loadTextureWithFallback(url, type) {
    if (!url) {
      var fbCvs = createFallbackCanvas(type, game.name, plat, game.sub);
      var fbTex = new THREE.CanvasTexture(fbCvs);
      fbTex.generateMipmaps = true;
      markLoaded();
      return fbTex;
    }

    var targetUrl = getTextureUrl(url);
    var tex = textureLoader.load(
      targetUrl,
      function(t) {
        t.generateMipmaps = true;
        t.minFilter = THREE.LinearMipmapLinearFilter;
        markLoaded();
      },
      undefined,
      function(err) {
        console.warn('[3DViewer] 紋理載入失敗，啟動備用程序紋理:', url);
        var fbCvs = createFallbackCanvas(type, game.name, plat, game.sub);
        tex.image = fbCvs;
        tex.needsUpdate = true;
        markLoaded();
      }
    );
    return tex;
  }

  var textures = {
    cover: loadTextureWithFallback(game.cover, 'cover'),
    back:  loadTextureWithFallback(game.back, 'back'),
    spine: loadTextureWithFallback(game.spine, 'spine')
  };

  // 紙質/塑膠微材質屬性
  var matProps = {
    roughness: dim.paper ? 0.45 : 0.28,
    metalness: dim.paper ? 0.03 : 0.12,
    clearcoat: dim.paper ? 0.1 : 0.4,
    clearcoatRoughness: 0.2
  };

  // 生成側邊/頂部素色紙紋材質（取自書背色調）
  var sideMat = new THREE.MeshStandardMaterial(Object.assign({
    map: textures.spine
  }, matProps));

  var edgeMat = new THREE.MeshStandardMaterial(Object.assign({
    color: dim.paper ? 0xddddcc : 0x111317
  }, matProps));

  // 6 個面的材質順序：[X+, X-, Y+, Y-, Z+, Z-]
  // [書背側, 對側, 頂部, 底部, 正面, 封底]
  var boxMaterials = [
    sideMat,                                      // X+ 右側 (書背)
    edgeMat,                                      // X- 左側
    edgeMat,                                      // Y+ 上蓋
    edgeMat,                                      // Y- 底蓋
    new THREE.MeshStandardMaterial(Object.assign({ map: textures.cover }, matProps)), // Z+ 正面
    new THREE.MeshStandardMaterial(Object.assign({ map: textures.back  }, matProps))  // Z- 封底
  ];

  // 外盒幾何體
  var outerGeo = new THREE.BoxGeometry(dim.w, dim.h, dim.d);
  outerBoxMesh = new THREE.Mesh(outerGeo, boxMaterials);
  outerBoxMesh.castShadow = true;
  outerBoxMesh.receiveShadow = true;
  mainBoxGroup.add(outerBoxMesh);

  // 2. 建立「開盒抽出」的內部物件（內塑膠內襯 + 實體卡匣）
  buildInnerCartridge(plat, dim, textures, game);

  // 重設開盒狀態
  isUnboxed = false;
  unboxProgress = 0;
  updateUnboxUI();
}

// 建立抽出之卡帶與托盤
function buildInnerCartridge(plat, dim, textures, game) {
  if (plat === 'BOOK' || (game && (game.isBook || (game.sub && (game.sub.indexOf('攻略') >= 0 || game.sub.indexOf('書籍') >= 0))))) {
    innerTrayGroup = null;
    cartMesh = null;
    return;
  }
  innerTrayGroup = new THREE.Group();

  var cartWidth = dim.w * 0.85;
  var cartHeight = dim.h * 0.75;
  var cartDepth = dim.d * 0.65;

  // 卡帶外殼（經典紅白機卡帶或 MD 黑色卡帶）
  var cartColor = game.cartColor ? parseInt(game.cartColor.replace('#',''), 16) : (plat === 'FC' ? 0x8a2323 : 0x14181f);
  var cartGeo = new THREE.BoxGeometry(cartWidth, cartHeight, cartDepth);
  
  // 卡帶正面貼紙
  var cartLabelMat = new THREE.MeshStandardMaterial({
    map: textures.cover,
    roughness: 0.35,
    metalness: 0.05
  });
  var cartBodyMat = new THREE.MeshStandardMaterial({
    color: cartColor,
    roughness: 0.55,
    metalness: 0.05
  });

  var cartMaterials = [
    cartBodyMat, cartBodyMat, cartBodyMat,
    new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 0.9 }), // 底部金手指金屬接點縫隙
    cartLabelMat, // 卡帶封面標籤
    cartBodyMat
  ];

  cartMesh = new THREE.Mesh(cartGeo, cartMaterials);
  cartMesh.castShadow = true;
  innerTrayGroup.add(cartMesh);

  // 如果是 FC，補上標誌性的白色內托盤
  if (plat === 'FC') {
    var trayGeo = new THREE.BoxGeometry(dim.w * 0.94, dim.h * 0.94, dim.d * 0.85);
    var trayMat = new THREE.MeshStandardMaterial({ color: 0xf5f5fa, roughness: 0.65, metalness: 0.0 });
    var trayMesh = new THREE.Mesh(trayGeo, trayMat);
    trayMesh.position.z = -0.05;
    innerTrayGroup.add(trayMesh);
  }

  // 初始藏在外盒內部
  innerTrayGroup.position.set(0, 0, 0);
  mainBoxGroup.add(innerTrayGroup);
}

// ══ 開盒抽出動畫補間 ══
function toggleUnbox() {
  if (currentGame && (currentGame.platform === 'BOOK' || currentGame.isBook)) return;
  isUnboxed = !isUnboxed;
  updateUnboxUI();
}

function updateUnboxUI() {
  var btn = document.getElementById('btn-unbox');
  var txt = document.getElementById('txt-unbox');
  var isBook = currentGame && (currentGame.platform === 'BOOK' || currentGame.isBook || (currentGame.sub && (currentGame.sub.indexOf('攻略') >= 0 || currentGame.sub.indexOf('書籍') >= 0)));
  if (isBook) {
    if (btn) btn.style.display = 'none';
    return;
  }
  if (btn) btn.style.display = 'flex';
  if (isUnboxed) {
    btn.classList.add('active');
    txt.textContent = '闔上';
  } else {
    btn.classList.remove('active');
    txt.textContent = '開盒';
  }
}

// ══ 燈光風格切換 ══
function cycleLighting() {
  currentLightMode = (currentLightMode + 1) % 3;
  var txt = document.getElementById('txt-light');
  if (currentLightMode === 0) {
    txt.textContent = '展櫃';
    lights.ambient.color.setHex(0xffffff);
    lights.ambient.intensity = 0.7;
    lights.main.color.setHex(0xfff5ea);
    lights.main.intensity = 1.8;
    lights.rim.color.setHex(0x00e5ff);
    lights.rim.intensity = 1.2;
  } else if (currentLightMode === 1) {
    txt.textContent = '暖光';
    lights.ambient.color.setHex(0xffecd2);
    lights.ambient.intensity = 0.85;
    lights.main.color.setHex(0xffb74d);
    lights.main.intensity = 2.0;
    lights.rim.color.setHex(0xffe0b2);
    lights.rim.intensity = 0.7;
  } else {
    txt.textContent = '霓虹';
    lights.ambient.color.setHex(0x2a164d);
    lights.ambient.intensity = 0.6;
    lights.main.color.setHex(0xff2a85);
    lights.main.intensity = 2.4;
    lights.rim.color.setHex(0x00e5ff);
    lights.rim.intensity = 2.0;
  }
}

// ══ 自動旋轉切換 ══
function toggleAutoRotate() {
  isAutoRotating = !isAutoRotating;
  controls.autoRotate = isAutoRotating;
  document.getElementById('btn-autorotate').classList.toggle('active', isAutoRotating);
}

// ══ 視角重設 ══
function resetView(face) {
  isAutoRotating = false;
  controls.autoRotate = false;
  document.getElementById('btn-autorotate').classList.remove('active');

  var dist = 8.5;
  if (face === 'front') {
    camera.position.set(0, 0, dist);
  } else if (face === 'back') {
    camera.position.set(0, 0, -dist);
  } else if (face === 'spine') {
    camera.position.set(dist, 0, 0);
  }
  controls.target.set(0, 0, 0);
  controls.update();
}

// ══ 全螢幕 ══
function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(function(){});
  } else {
    if (document.exitFullscreen) document.exitFullscreen();
  }
}

// ══ 範例切換 ══
function onSelectSample(idx) {
  var game = SAMPLE_GAMES[parseInt(idx, 10)] || SAMPLE_GAMES[0];
  loadGame(game);
}

function loadGame(game) {
  currentGame = game;
  var plat = game.platform || 'FC';
  var isBook = plat === 'BOOK' || game.isBook || (game.sub && (game.sub.indexOf('攻略') >= 0 || game.sub.indexOf('書籍') >= 0));
  var platText = 'FAMICOM / 紅白機';
  if (plat === 'MD') platText = 'MEGA DRIVE / 世嘉五代';
  else if (isBook) platText = 'GAME GUIDE / 攻略書籍';
  else if (plat && plat !== 'FC') platText = plat;

  document.getElementById('pill-plat').textContent = platText + ' · ' + (game.sub || '');
  document.getElementById('pill-title').textContent = game.name;
  build3DBox(game);
}

// ══ 初始化檢查 URL 參數或快取 ══
function loadInitialGame() {
  var params = new URLSearchParams(window.location.search);
  var pName = params.get('name');
  var pCover = params.get('cover');
  var pBack = params.get('back');
  var pSpine = params.get('spine');
  var pPlat = params.get('platform') || 'FC';
  var pSub = params.get('sub') || pPlat;
  var isBook = pPlat === 'BOOK' || pSub.indexOf('攻略') >= 0 || pSub.indexOf('書籍') >= 0;

  if (pName && pCover) {
    var customGame = {
      platform: isBook ? 'BOOK' : pPlat,
      name: pName,
      sub: pSub,
      isBook: isBook,
      cover: pCover,
      back: pBack || pCover,
      spine: pSpine || pCover
    };
    loadGame(customGame);
  } else {
    // 預設載入第 0 款（三國志）
    loadGame(SAMPLE_GAMES[0]);
  }
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

// ══ 動畫迴圈 ══
function animate() {
  requestAnimationFrame(animate);

  // 控制器平滑更新
  controls.update();

  // 開盒動畫線性平滑插值 (Lerp)
  var targetUnbox = isUnboxed ? 1 : 0;
  unboxProgress += (targetUnbox - unboxProgress) * 0.08;

  if (innerTrayGroup && currentGame) {
    var dim = BOX_DIMENSIONS[currentGame.platform] || BOX_DIMENSIONS.FC;
    // 盒蓋/外盒微微向左傾，卡帶向右上方滑出
    if (currentGame.platform === 'FC') {
      innerTrayGroup.position.x = unboxProgress * (dim.w * 0.88);
      innerTrayGroup.position.y = unboxProgress * (dim.h * 0.25);
      innerTrayGroup.rotation.z = -unboxProgress * 0.12;
    } else {
      // MD 經典黑盒：卡帶向上方抽出
      innerTrayGroup.position.y = unboxProgress * (dim.h * 0.72);
      innerTrayGroup.position.z = unboxProgress * 0.35;
      innerTrayGroup.rotation.x = -unboxProgress * 0.18;
    }
  }

  renderer.render(scene, camera);
}

window.addEventListener('DOMContentLoaded', initThree);
</script>
