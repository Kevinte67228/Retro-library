<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>數位鑑定卡工坊 · RetroVault Slab Studio</title>
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');

:root {
  --bg: #060913;
  --panel: rgba(14, 20, 36, 0.88);
  --border: rgba(42, 58, 90, 0.65);
  --cyan: #00e5ff;
  --mint: #69f0ae;
  --gold: #ffd700;
  --purple: #ce93d8;
  --txt: #e8eaf6;
  --txt2: #9fa8c8;
  --txt3: #5a6788;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  font-family: 'Noto Sans TC', sans-serif;
  color: var(--txt);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background-image: 
    radial-gradient(circle at 15% 20%, rgba(212, 175, 55, 0.08) 0%, transparent 40%),
    radial-gradient(circle at 85% 75%, rgba(0, 229, 255, 0.08) 0%, transparent 45%),
    linear-gradient(180deg, #05070f 0%, #0a0e1c 100%);
}

header {
  padding: 14px 20px;
  background: rgba(10, 14, 26, 0.92);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  backdrop-filter: blur(14px);
  position: sticky;
  top: 0;
  z-index: 50;
}

.brand-area {
  display: flex;
  align-items: center;
  gap: 10px;
}
.brand-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 900;
  color: var(--gold);
  padding: 4px 8px;
  border-radius: 6px;
  background: rgba(212, 175, 55, 0.12);
  border: 1px solid rgba(212, 175, 55, 0.4);
}
.brand-title {
  font-size: 14px;
  font-weight: 900;
  color: #fff;
}

.nav-btn {
  font-size: 12px;
  font-weight: 700;
  color: var(--txt2);
  text-decoration: none;
  padding: 6px 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: rgba(15, 22, 40, 0.7);
  transition: all 0.15s;
}
.nav-btn:hover {
  color: var(--cyan);
  border-color: var(--cyan);
}

.workspace {
  flex: 1;
  max-width: 1100px;
  width: 100%;
  margin: 0 auto;
  padding: 24px 20px 60px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 360px;
  gap: 30px;
  align-items: start;
  box-sizing: border-box;
}
@media (max-width: 820px) {
  .workspace {
    grid-template-columns: minmax(0, 1fr);
    padding: 16px 12px 50px;
    gap: 20px;
  }
}
@media (max-width: 600px) {
  header { padding: 10px 12px; }
  .brand-area .brand-title { display: none; }
  .nav-btn { padding: 5px 8px; font-size: 11px; }
  .workspace { padding: 12px 10px 50px; }
}

/* 鑑定卡 3D 視角容器 (Slab Stage) */
.stage-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  perspective: 1200px;
  padding: 6px 0;
  width: 100%;
  max-width: 100%;
  box-sizing: border-box;
  overflow: visible;
}

.slab-card-wrapper {
  position: relative;
  width: 100%;
  max-width: 360px;
  aspect-ratio: 1080 / 1620;
  transform-style: preserve-3d;
  transition: transform 0.1s ease-out, box-shadow 0.2s ease;
  cursor: grab;
  box-sizing: border-box;
}

/* 顯示 Canvas */
#slab-canvas {
  width: 100%;
  height: 100%;
  max-width: 100%;
  border-radius: 20px;
  box-shadow: 
    0 20px 50px rgba(0,0,0,0.85),
    0 0 35px rgba(212, 175, 55, 0.18);
  display: block;
}

/* 控制設定側欄 */
.control-panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  backdrop-filter: blur(14px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.panel-title {
  font-size: 14px;
  font-weight: 900;
  letter-spacing: 0.5px;
  display: flex;
  align-items: center;
  gap: 8px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 12px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.form-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--txt3);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.form-select, .form-input {
  background: rgba(8, 12, 22, 0.85);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  outline: none;
}
.form-select:focus, .form-input:focus {
  border-color: var(--cyan);
}

/* 主題按鈕群組 */
.theme-selector {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}
.theme-btn {
  padding: 8px 6px;
  border-radius: 10px;
  background: rgba(15, 22, 40, 0.6);
  border: 1px solid var(--border);
  color: var(--txt2);
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  text-align: center;
  transition: all 0.15s;
}
.theme-btn:hover { color: #fff; border-color: var(--txt3); }
.theme-btn.active {
  background: rgba(212, 175, 55, 0.15);
  border-color: var(--gold);
  color: var(--gold);
}

/* 操作按鈕 */
.actions-area {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 8px;
}

.btn-primary {
  padding: 13px 18px;
  border-radius: 12px;
  background: linear-gradient(135deg, #d4af37 0%, #aa820a 100%);
  border: 1px solid #ffd700;
  color: #060810;
  font-size: 13.5px;
  font-weight: 900;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-shadow: 0 4px 16px rgba(212, 175, 55, 0.35);
  transition: all 0.15s;
}
.btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 22px rgba(212, 175, 55, 0.5);
}

.btn-secondary {
  padding: 11px 16px;
  border-radius: 12px;
  background: rgba(0, 229, 255, 0.12);
  border: 1px solid var(--cyan);
  color: var(--cyan);
  font-size: 12.5px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 0.15s;
}
.btn-secondary:hover {
  background: var(--cyan);
  color: #060913;
  box-shadow: 0 0 16px rgba(0, 229, 255, 0.4);
}

.tips-box {
  background: rgba(10, 14, 26, 0.5);
  border: 1px dashed var(--border);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 11px;
  color: var(--txt3);
  line-height: 1.6;
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
<script src="./js/slab-generator.js?v=v11.09"></script>
</head>
<body>

<header>
  <div class="brand-area">
    <span class="brand-badge">SLAB STUDIO v11.09</span>
    <span class="brand-title">數位封裝鑑定卡工坊</span>
  </div>
  <div style="display:flex;gap:8px">
    <a href="./cyber-museum.html" class="nav-btn">📺 賽博展廳</a>
    <a href="./index.html" class="nav-btn">← 返回主程式</a>
  </div>
</header>

<div class="workspace">
  <!-- 左側：鑑定卡 3D 擬真展示台 -->
  <div class="stage-container">
    <div class="slab-card-wrapper" id="slab-wrapper">
      <canvas id="slab-canvas" width="1080" height="1620"></canvas>
    </div>
    <div style="margin-top:14px;font-size:11.5px;color:var(--txt3)">👆 滑鼠移過或滑動可感受壓測光澤 · 支援長按儲存圖片</div>
  </div>

  <!-- 右側：客製調整與匯出控制板 -->
  <div class="control-panel">
    <div class="panel-title">
      <span>💎 鑑定卡規格設定</span>
    </div>

    <!-- 選擇藏品 -->
    <div class="form-group">
      <label class="form-label">選擇藏品來源</label>
      <select class="form-select" id="game-picker" onchange="onGamePicked(this.value)">
        <option value="">正在讀取藏品清單...</option>
      </select>
    </div>

    <!-- 鑑定評級選擇 -->
    <div class="form-group">
      <label class="form-label">封裝評級 (Grade Score)</label>
      <select class="form-select" id="grade-picker" onchange="updateSlab()">
        <option value="AUTO">✨ 依品相自動評級</option>
        <option value="10.0">10.0 GEM MINT (極致無瑕)</option>
        <option value="9.8">9.8 MINT+ (頂級美品)</option>
        <option value="9.6">9.6 MINT (盒書齊全)</option>
        <option value="9.4">9.4 NEAR MINT+ (良好保存)</option>
        <option value="8.5">8.5 EX/NM (普通收藏)</option>
        <option value="CART">CART ONLY (真品裸卡)</option>
      </select>
    </div>

    <!-- 主題風格 -->
    <div class="form-group">
      <label class="form-label">防偽銘牌主題</label>
      <div class="theme-selector">
        <button class="theme-btn active" id="th-gold" onclick="setTheme('gold', this)">🥇 奢華金</button>
        <button class="theme-btn" id="th-holo" onclick="setTheme('holo', this)">🌈 全息藍</button>
        <button class="theme-btn" id="th-dark" onclick="setTheme('dark', this)">🖤 黑曜石</button>
      </div>
    </div>

    <!-- 序號客製 -->
    <div class="form-group">
      <label class="form-label">認證專屬防偽序號</label>
      <input class="form-input" id="custom-serial" value="RV-88392015" oninput="updateSlab()">
    </div>

    <!-- 操作按鈕 -->
    <div class="actions-area">
      <button class="btn-primary" onclick="downloadSlabPng()">
        <span>📸 下載高畫質鑑定卡 (PNG)</span>
      </button>

      <button class="btn-secondary" onclick="exportPrivateExhibition()">
        <span>🏛️ 一鍵匯出私人展覽館 (HTML)</span>
      </button>
    </div>

    <div class="tips-box">
      <strong>🔒 安全去隱私匯出保證：</strong><br>
      產出的個人展覽網頁會自動抹除所有「購入價格、保管防潮箱位置、個人帳號、試算表金鑰」，完全純前端獨立運作，可放心傳送給同好瀏覽。
    </div>
  </div>
</div>

<script>
var currentItem = null;
var myCollection = [];
var currentTheme = 'gold';

// 3D 陀螺儀/滑鼠微傾角光影
var wrapper = document.getElementById('slab-wrapper');
wrapper.addEventListener('mousemove', function(e) {
  var rect = wrapper.getBoundingClientRect();
  var x = e.clientX - rect.left - rect.width / 2;
  var y = e.clientY - rect.top - rect.height / 2;
  var rotX = (-y / (rect.height / 2)) * 12;
  var rotY = (x / (rect.width / 2)) * 12;
  wrapper.style.transform = 'rotateX(' + rotX.toFixed(2) + 'deg) rotateY(' + rotY.toFixed(2) + 'deg)';
});
wrapper.addEventListener('mouseleave', function() {
  wrapper.style.transform = 'rotateX(0deg) rotateY(0deg)';
});

function setTheme(th, btn) {
  document.querySelectorAll('.theme-btn').forEach(function(el) { el.classList.remove('active'); });
  btn.classList.add('active');
  currentTheme = th;
  updateSlab();
}

function updateSlab() {
  if (!currentItem) return;
  var canvas = document.getElementById('slab-canvas');
  var gradeChoice = document.getElementById('grade-picker').value;
  var serial = document.getElementById('custom-serial').value;

  var customGrade = null;
  if (gradeChoice !== 'AUTO') {
    if (gradeChoice === '10.0') customGrade = { score: '10.0', rank: 'GEM MINT', sub: 'PERFECT 10', color: '#ffd700' };
    else if (gradeChoice === '9.8') customGrade = { score: '9.8', rank: 'MINT+', sub: 'BOX 9.8 / CART 9.8', color: '#00e5ff' };
    else if (gradeChoice === '9.6') customGrade = { score: '9.6', rank: 'MINT', sub: 'COMPLETE SET', color: '#69f0ae' };
    else if (gradeChoice === '9.4') customGrade = { score: '9.4', rank: 'NEAR MINT', sub: 'ARCHIVAL GRADE', color: '#00e5ff' };
    else if (gradeChoice === '8.5') customGrade = { score: '8.5', rank: 'EX/NM', sub: 'AUTHENTIC', color: '#ffb74d' };
    else if (gradeChoice === 'CART') customGrade = { score: 'CART', rank: 'AUTHENTIC', sub: 'CARTRIDGE ONLY', color: '#ce93d8' };
  }

  SlabGenerator.renderSlab(canvas, currentItem, {
    theme: currentTheme,
    customGrade: customGrade,
    customSerial: serial
  });
}

function onGamePicked(idx) {
  var game = myCollection[parseInt(idx, 10)];
  if (game) {
    currentItem = game;
    updateSlab();
  }
}

// 📸 下載 PNG
function downloadSlabPng() {
  var canvas = document.getElementById('slab-canvas');
  var name = (currentItem ? currentItem.primary_name : 'RetroVault') + '_Slab.png';
  try {
    var dataUrl = canvas.toDataURL('image/png', 0.95);
    var link = document.createElement('a');
    link.download = name.replace(/[\\/:*?"<>|]/g, '_');
    link.href = dataUrl;
    link.click();
  } catch (err) {
    alert('由於原圖床跨網域安全性限制，請直接在上方鑑定卡上「長按儲存圖片」或截圖分享！');
  }
}

// 🏛️ 一鍵匯出安全展覽館
function exportPrivateExhibition() {
  if (!myCollection.length) {
    alert('目前尚無藏品資料可供匯出。');
    return;
  }

  // 抹除敏感資料 (購入成本、防潮箱位置、個人帳號等)
  var sanitized = myCollection.map(function(it) {
    return {
      primary_name: it.primary_name,
      platform: it.platform,
      category: it.category || '遊戲',
      developer: it.developer || '',
      release_date: it.release_date || '',
      completeness: it.completeness || '',
      cover_img: it.cover_img || '',
      back_img: it.back_img || '',
      spine_img: it.spine_img || ''
    };
  });

  var htmlTemplate = '<!DOCTYPE html>\n' +
'<html lang="zh-Hant">\n' +
'<head>\n' +
'<meta charset="UTF-8">\n' +
'<meta name="viewport" content="width=device-width, initial-scale=1.0">\n' +
'<title>私人復古遊戲展覽館 · Private Exhibition</title>\n' +
'<style>\n' +
'body{margin:0;padding:24px 16px;background:#080c18;color:#e8eaf6;font-family:sans-serif;}\n' +
'h1{font-size:22px;color:#00e5ff;text-align:center;margin-bottom:6px;}\n' +
'.sub{text-align:center;color:#7986cb;font-size:13px;margin-bottom:24px;}\n' +
'#grid{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;}\n' +
'.card{background:#0f1525;border:1px solid #1e2a45;border-radius:12px;overflow:hidden;padding:10px;text-align:center;}\n' +
'.thumb{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:6px;background:#141b30;}\n' +
'.title{font-size:12.5px;font-weight:700;margin:8px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}\n' +
'.meta{font-size:11px;color:#00e5ff;}\n' +
'</style>\n' +
'</head>\n' +
'<body>\n' +
'<h1>🏛️ 私人復古遊戲展覽館</h1>\n' +
'<div class="sub">RetroVault 認證收藏 · 共 ' + sanitized.length + ' 件珍藏</div>\n' +
'<div id="grid"></div>\n' +
'<script>\n' +
'var data = ' + JSON.stringify(sanitized) + ';\n' +
'var grid = document.getElementById("grid");\n' +
'grid.innerHTML = data.map(function(it){\n' +
'  return "<div class=\\"card\\">" +\n' +
'    "<img class=\\"thumb\\" src=\\"" + (it.cover_img || "./bg.webp") + "\\">" +\n' +
'    "<div class=\\"title\\">" + (it.primary_name || "") + "</div>" +\n' +
'    "<div class=\\"meta\\">" + (it.platform || "") + " · " + (it.completeness || "") + "</div>" +\n' +
'  "</div>";\n' +
'}).join("");\n' +
'<\/script>\n' +
'</body>\n' +
'</html>';

  var blob = new Blob([htmlTemplate], { type: 'text/html;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'RetroVault_私人展覽館.html';
  a.click();
  setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
}

// 輔助函式
function imgUrl(v, sz) {
  if (!v || typeof v !== 'string') return '';
  if (v.indexOf('data:') === 0 || v.indexOf('http') === 0) return v;
  return 'https://drive.google.com/thumbnail?id=' + v + '&sz=w' + (sz || 800);
}

window.addEventListener('DOMContentLoaded', function() {
  localforage.getItem('gv_col').then(function(cached) {
    if (cached && Array.isArray(cached) && cached.length) {
      myCollection = cached.map(function(it) {
        var d = it.data || it;
        return {
          primary_name: d.primary_name || d.zh_name || d.jp_name || d.en_name || '未命名',
          platform: (d.platform || 'FC').toUpperCase(),
          developer: d.developer || d.publisher || '',
          release_date: d.release_date || '',
          completeness: d.completeness || '',
          cover_img: imgUrl(d.cover_img, 1000)
        };
      });
    }

    if (!myCollection.length) {
      myCollection = [
        {
          primary_name: '三国志',
          platform: 'FC',
          developer: 'KOEI',
          release_date: '1988',
          completeness: '盒裝完整',
          cover_img: 'https://cdn.jsdelivr.net/gh/libretro-thumbnails/Nintendo_-_Nintendo_Entertainment_System/Named_Boxarts/Sangokushi%20(Japan).png'
        },
        {
          primary_name: '餓狼伝説 (THE BATTLE OF DESTINY)',
          platform: 'MD',
          developer: 'SNK',
          release_date: '1992',
          completeness: '美品',
          cover_img: 'https://cdn.jsdelivr.net/gh/libretro-thumbnails/Sega_-_Mega_Drive_-_Genesis/Named_Boxarts/Garou%20Densetsu%20-%20Shukumei%20no%20Tatakai%20(Japan).png'
        }
      ];
    }

    // 填入選單
    var picker = document.getElementById('game-picker');
    picker.innerHTML = myCollection.map(function(it, idx) {
      return '<option value="' + idx + '">' + it.platform + ' · ' + it.primary_name + '</option>';
    }).join('');

    // 檢查 URL 參數是否指定
    var params = new URLSearchParams(window.location.search);
    var pName = params.get('name');
    var pCover = params.get('cover');
    var pPlat = params.get('platform');
    var pComp = params.get('comp');

    if (pName && pCover) {
      currentItem = {
        primary_name: pName,
        platform: (pPlat || 'FC').toUpperCase(),
        developer: params.get('dev') || 'ARCHIVE',
        release_date: params.get('date') || 'RETRO',
        completeness: pComp || '盒裝完整',
        cover_img: pCover
      };
    } else {
      currentItem = myCollection[0];
    }

    updateSlab();
  }).catch(function() {
    currentItem = {
      primary_name: '三国志',
      platform: 'FC',
      developer: 'KOEI',
      release_date: '1988',
      completeness: '盒裝完整',
      cover_img: 'https://cdn.jsdelivr.net/gh/libretro-thumbnails/Nintendo_-_Nintendo_Entertainment_System/Named_Boxarts/Sangokushi%20(Japan).png'
    };
    updateSlab();
  });
});
</script>
</body>
</html>
